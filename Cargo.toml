[package]
name = "intrusive-red-black-tree"
version = "0.1.2"
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/intrusive-red-black-tree"
homepage = "https://github.com/KiyanSisakhti/intrusive-red-black-tree.git"
repository = "https://github.com/KiyanSisakhti/intrusive-red-black-tree.git"
description = "A deterministic, zero-allocation, intrusive Red-Black Tree implementation engineered specifically for #![no_std] environments"
readme = "README.md"

keywords = [
    "no_std",
    "intrusive",
    "red-black-tree",
    "kernel",
    "allocator"
]

categories = [
    "data-structures",
    "no-std",
    "embedded",
    "memory-management",
    "algorithms"
]

[dependencies]


[dev-dependencies]
bolero = "0.13.4"
rand = "0.10.2"


[dev-dependencies.cargo-husky]
version = "1"
default-features = false # Disable features which are enabled by default
features = ["precommit-hook", "prepush-hook", "run-cargo-test", "run-cargo-clippy", "run-cargo-fmt"]